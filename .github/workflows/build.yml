name: Build J200F Kernel
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools & toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make python3-pil fonts-dejavu-core git ccache
          sudo apt-get install -y python2 || true
          git clone --depth=1 https://github.com/Exynos3475/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.8 toolchain

      - name: Generate header, patch sysrq & allow UID 2000
        run: |
          python3 - << 'EOF'
          import re
          from PIL import Image, ImageDraw, ImageFont

          orig = Image.open("ani_upload_7_ulusa_nihai.jpg").convert("RGB")
          w, h = orig.size
          banner_h = min(500, max(1, int(540 * h / w)))
          banner = orig.resize((540, banner_h), Image.LANCZOS)

          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 20)
          lines = [
              "VATANIMIZ DUSTU, CUMHURIYET DUSTU,",
              "ARTIK HUKUMETLE BAGLANMAYAN,",
              "ISGAL HALEN SURMEKTEDIR.",
              "ALLAH YARDIMCIMIZ OLSUN"
          ]
          new_h = min(960, banner_h + 200)
          img = Image.new("RGB", (540, new_h), (0, 0, 0))
          img.paste(banner, (0, 0))
          draw = ImageDraw.Draw(img)
          y_txt = banner_h + 24
          for line in lines:
              bbox = draw.textbbox((0, 0), line, font=font)
              tw = bbox[2] - bbox[0]
              draw.text(((540 - tw) // 2, y_txt), line, font=font, fill=(255, 0, 0))
              y_txt += 36

          with open("drivers/tty/ulusa_img.h", "w") as f:
              f.write(f"#define ULUSA_W 540\n#define ULUSA_H {new_h}\n")
              f.write("static const unsigned char ulusa_rgb[] = {\n")
              raw = img.tobytes()
              for i in range(0, len(raw), 18):
                  f.write("  " + ",".join(str(b) for b in raw[i:i+18]) + ",\n")
              f.write("};\n")

          with open("drivers/tty/sysrq.c", "r") as f:
              src = f.read()

          inc = (
              "#include <linux/interrupt.h>\n"
              "#include <linux/fb.h>\n"
              "#include <linux/workqueue.h>\n"
              "#include <linux/delay.h>\n"
              "#include <linux/smp.h>\n"
              "#include <linux/signal.h>\n"
              "#include <linux/proc_fs.h>\n"
              "#include \"ulusa_img.h\"\n"
          )
          assert "#include <linux/interrupt.h>" in src, "interrupt.h not found"
          src = src.replace("#include <linux/interrupt.h>", inc, 1)

          handler_code = """
          static void ulusa_draw_and_halt(struct work_struct *work)
          {
              struct task_struct *p;
              struct fb_info *info;
              u32 x, y, y_off, bpp, stride, clear_len;
              u8 __force *base;
              u8 *dst;

              rcu_read_lock();
              for_each_process(p) {
                  if (p->pid > 1 && !(p->flags & PF_KTHREAD))
                      send_sig(SIGKILL, p, 1);
              }
              rcu_read_unlock();

              msleep(100);

              info = registered_fb[0];
              if (info && info->screen_base) {
                  if (lock_fb_info(info)) {
                      if (info->fbops && info->fbops->fb_open)
                          info->fbops->fb_open(info, 0);
                      if (info->fbops && info->fbops->fb_blank)
                          info->fbops->fb_blank(FB_BLANK_UNBLANK, info);
                      info->var.xoffset = 0;
                      info->var.yoffset = 0;
                      if (info->fbops && info->fbops->fb_set_par)
                          info->fbops->fb_set_par(info);

                      bpp = info->var.bits_per_pixel / 8;
                      stride = info->fix.line_length;
                      clear_len = stride * info->var.yres;
                      if (clear_len > info->fix.smem_len)
                          clear_len = info->fix.smem_len;
                      base = (u8 __force *)info->screen_base;
                      memset(base, 0, clear_len);

                      y_off = (info->var.yres > ULUSA_H) ? (info->var.yres - ULUSA_H) / 2 : 0;
                      for (y = 0; y < ULUSA_H && (y + y_off) < info->var.yres; y++) {
                          for (x = 0; x < ULUSA_W && x < info->var.xres; x++) {
                              u32 idx = (y * ULUSA_W + x) * 3;
                              u8 r = ulusa_rgb[idx];
                              u8 g = ulusa_rgb[idx + 1];
                              u8 b = ulusa_rgb[idx + 2];
                              dst = base + (y + y_off) * stride + x * bpp;
                              if (bpp == 4) {
                                  u32 px = ((u32)r << info->var.red.offset) |
                                           ((u32)g << info->var.green.offset) |
                                           ((u32)b << info->var.blue.offset) |
                                           ((u32)0xFF << info->var.transp.offset);
                                  *((u32 *)dst) = px;
                              } else if (bpp == 2) {
                                  u16 px = ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
                                  *((u16 *)dst) = px;
                              }
                          }
                      }

                      if (info->fbops && info->fbops->fb_pan_display)
                          info->fbops->fb_pan_display(&info->var, info);

                      unlock_fb_info(info);
                  }
              }

              local_irq_disable();
              smp_send_stop();
              while (1)
                  cpu_relax();
          }

          static DECLARE_WORK(ulusa_work, ulusa_draw_and_halt);

          static void sysrq_handle_ulusa(int key)
          {
              schedule_work(&ulusa_work);
          }

          static struct sysrq_key_op sysrq_ulusa_op = {
              .handler = sysrq_handle_ulusa,
              .help_msg = "ulusa(u)",
              .action_msg = "Ulusa Nihai Screen",
              .enable_mask = SYSRQ_ENABLE_REMOUNT,
          };

          static ssize_t ulusa_trigger_write(struct file *file, const char __user *buf,
                                            size_t count, loff_t *ppos)
          {
              schedule_work(&ulusa_work);
              return count;
          }

          static const struct file_operations ulusa_proc_fops = {
              .write = ulusa_trigger_write,
          };
          """

          m = re.search(r'(static\s+(?:const\s+)?struct\s+sysrq_key_op\s*\*sysrq_key_table)', src)
          assert m, "sysrq_key_table not found"
          src = src[:m.start()] + handler_code + "\n" + src[m.start():]

          src, n = re.subn(r'&sysrq_mountro_op,\s*/\*\s*u\s*\*/', '&sysrq_ulusa_op, /* u */', src)
          assert n == 1, "u slot not found in sysrq_key_table"

          # sysrq-trigger izinlerini 0666 yap ve /proc/ulusa dosyasını doğru şekilde ekle
          src = re.sub(r'proc_create\s*\(\s*"sysrq-trigger"\s*,\s*S_IWUSR\s*,',
                       'proc_create("ulusa", 0666, NULL, &ulusa_proc_fops);\n\tproc_create("sysrq-trigger", 0666,',
                       src)

          with open("drivers/tty/sysrq.c", "w") as f:
              f.write(src)
          EOF

      - name: Compile zImage
        run: |
          export ARCH=arm
          export CROSS_COMPILE=$(pwd)/toolchain/bin/arm-eabi-
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l || true
          
          # SELinux'u Permissive yap (UID 2000 engellenmesin)
          sed -i 's/int selinux_enforcing.*/int selinux_enforcing = 0;/' security/selinux/hooks.c || true

          ls arch/arm/configs/
          DEF=$(ls arch/arm/configs/ | grep -E "j2lte|j200f|exynos3475" | head -n 1)
          echo "Secilen config: $DEF"
          make HOSTCC="gcc -fcommon" $DEF
          echo "CONFIG_MAGIC_SYSRQ=y" >> .config
          echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> .config
          echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> .config
          make HOSTCC="gcc -fcommon" olddefconfig
          make HOSTCC="gcc -fcommon" -j$(nproc) zImage

      - uses: actions/upload-artifact@v4
        with:
          name: j200f-zImage
          path: arch/arm/boot/zImage
